  <path d="M80,70 L78,72" stroke="#8b4513" stroke-width="0.75" />
  <path d="M70,60 L68,62" stroke="#8b4513" stroke-width="0.75" />
  
  <!-- Adjustment screw -->
  <rect x="57" y="52" width="6" height="3" rx="1" fill="#8b4513" />
  
