  <circle cx="60" cy="60" r="2" fill="#8b4513" />
  
  <!-- Divider arms -->
  <path d="M60,60 L20,100" stroke="#d4a76a" stroke-width="5" stroke-linecap="round" />
  <path d="M60,60 L100,100" stroke="#d4a76a" stroke-width="5" stroke-linecap="round" />
  
  <!-- Divider arm outlines -->
  <path d="M60,60 L20,100" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round" />
  <path d="M60,60 L100,100" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Divider tips -->
  <circle cx="20" cy="100" r="2" fill="#8b4513" />
  <circle cx="100" cy="100" r="2" fill="#8b4513" />
  
