  <path d="M30,80 L32,82" stroke="#8b4513" stroke-width="0.75" />
  <path d="M40,70 L42,72" stroke="#8b4513" stroke-width="0.75" />
  <path d="M50,60 L52,62" stroke="#8b4513" stroke-width="0.75" />
  
