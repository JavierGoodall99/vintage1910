<?xml version="1.0" encoding="UTF-8"?>
<svg width="120px" height="120px" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background wooden block -->
  <rect x="20" y="25" width="80" height="70" rx="2" fill="#8b4513" stroke="#6b3004" stroke-width="1" />
  
  <!-- Letterpress blocks -->
  <g transform="translate(25, 30)">
    <!-- A block -->
    <rect x="0" y="0" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="10" y="20" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-20, 0)">A</text>
    
    <!-- B block -->
    <rect x="25" y="0" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="35" y="20" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-70, 0)">B</text>
    
    <!-- C block -->
    <rect x="50" y="0" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="60" y="20" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-120, 0)">C</text>
    
    <!-- 1 block -->
    <rect x="0" y="30" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="10" y="50" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-20, 0)">1</text>
    
    <!-- 2 block -->
    <rect x="25" y="30" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="35" y="50" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-70, 0)">2</text>
    
    <!-- 3 block -->
    <rect x="50" y="30" width="20" height="25" fill="#d2b48c" stroke="#8b4513" stroke-width="0.5" />
    <text x="60" y="50" text-anchor="middle" font-family="serif" font-size="18" fill="#333" transform="scale(-1, 1) translate(-120, 0)">3</text>
  </g>
  
  <!-- Ink stains -->
  <circle cx="30" cy="40" r="3" fill="#333" fill-opacity="0.7" />
  <circle cx="75" cy="65" r="2" fill="#333" fill-opacity="0.5" />
  <path d="M60,35 C62,33 65,34 63,37 C61,40 58,39 60,35 Z" fill="#333" fill-opacity="0.6" />
</svg>